version: "3.8"

networks:
  default:
    name: shadow

services:
  anvil:
    container_name: anvil
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "3000:8545"
    volumes:
      - "./tmp/anvil:/anvil"
    entrypoint: ["anvil"]
    command:
      - "--block-time"
      - "${ANVIL_BLOCK_TIME}"
      - "--host"
      - "0.0.0.0"
      - "--fork-url"
      - "${ANVIL_FORK_URL}"
      - "--state"
      - "/anvil"
      - "--fork-block-number"
      - "${ANVIL_FORK_BLOCK_NUMBER}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Agglayer Prover
  agglayer-prover:
    container_name: agglayer-prover
    image: ghcr.io/agglayer/agglayer:0.3.3
    volumes:
      - "./config:/etc/agglayer:ro"
    environment:
      - SP1_PRIVATE_KEY=${SP1_KEY}
      - NETWORK_RPC_URL=${NETWORK_RPC_URL}
      - RUST_BACKTRACE=${RUST_BACKTRACE}
      - NETWORK_PRIVATE_KEY=${SP1_KEY}
    entrypoint: ["agglayer"]
    command: ["prover", "--cfg", "/etc/agglayer/agglayer-prover-config.toml"]
    restart: unless-stopped
    depends_on:
      - anvil

  # Agglayer Node
  agglayer-node:
    container_name: agglayer-node
    image: ghcr.io/agglayer/agglayer:0.3.3
    volumes:
      - "./config:/etc/agglayer:ro"
      - "./tmp/agglayer:/var/agglayer"
    entrypoint: ["agglayer"]
    command: ["run", "--cfg", "/etc/agglayer/agglayer-config.toml"]
    restart: unless-stopped
    depends_on:
      - anvil
      - agglayer-prover

  # Node.js container for upgrade preparation
  upgrade-preparation:
    container_name: upgrade-preparation
    image: node:22-bookworm
    volumes:
      - "./tmp/agglayer-contracts:/agglayer-contracts"
      - "./config:/etc/config:ro"
    working_dir: /agglayer-contracts
    deploy:
      resources:
        limits:
          memory: ${UPGRADE_PREPARATION_MEMORY_LIMIT}
        reservations:
          memory: ${UPGRADE_PREPARATION_MEMORY_SWAP}
    command: ["bash", "-c", "/agglayer-contracts/prepare_upgrade.sh"]
    profiles:
      - upgrade
    depends_on:
      - anvil

  # Aggkit for testing and validation
  aggkit:
    container_name: aggkit
    image: aggkit:local
    volumes:
      - "./tmp/aggkit:/tmp"
      - "./config:/etc/aggkit"
    environment:
      - MAX_L2_BLOCK_NUMBER=${MAX_L2_BLOCK_NUMBER}
    command: ["sh", "-c", "envsubst < /etc/aggkit/aggkit.toml > /tmp/aggkit_processed.toml && run --cfg=/tmp/aggkit_processed.toml --components=aggsender,bridge"]
    profiles:
      - testing
    depends_on:
      - anvil
      - agglayer-node
      - agglayer-prover

  