syntax = "proto3";

package realtime;

option go_package = "./proto";

// Realtime service defines methods for streaming real-time transaction and log data from an Ethereum blockchain.
service Realtime {
  // OnRealtimeTransaction streams real-time transaction data, including the RLP-encoded transaction, receipt, and internal transactions.
  rpc OnRealtimeTransaction (RealtimeTransactionRequest) returns (stream RealtimeTransactionReply);

  // OnRealtimeLogs streams real-time log data, providing RLP-encoded logs emitted by smart contracts.
  rpc OnRealtimeLogs (RealtimeLogsRequest) returns (stream RealtimeLogsReply);
}

// RealtimeTransactionRequest is an empty message used as a placeholder for initiating the OnRealtimeTransaction stream.
// It may be extended in the future to include filtering criteria or other parameters.
message RealtimeTransactionRequest {}

// RealtimeTransactionReply represents a message containing a transaction, its receipt, and internal transactions.
message RealtimeTransactionReply {
  // RLP-encoded raw transaction data, representing the full transaction as serialized on the Ethereum blockchain.
  bytes rlp_transaction = 1;
  // Transaction receipt, containing consensus and derived fields about the transaction's execution.
  Receipt receipt = 2;
  // List of internal transactions or calls triggered during the transaction's execution.
  repeated InnerTx innerTxs = 3;
}

// Log represents an event log emitted by a smart contract.
// Address of the contract that generated the event.
message Log {
  bytes address = 1;
  // List of topics provided by the contract.
  repeated bytes topics = 2;
  // Data supplied by the contract, usually ABI-encoded.
  bytes data = 3;
  // Block number in which the transaction was included (derived, not consensus-secured).
  uint64 blockNumber = 4;
  // Hash of the transaction.
  bytes transactionHash = 5;
  // Index of the transaction in the block.
  uint64 transactionIndex = 6;
  // Hash of the block in which the transaction was included.
  bytes blockHash = 7;
  // Index of the log in the block.
  uint64 logIndex = 8;
  // True if this log was reverted due to a chain reorganization.
  bool removed = 9;
}

// Receipt represents a transaction receipt.
// Transaction type (as defined in the Ethereum Yellow Paper).
message Receipt {
  uint32 type = 1;
  // Post-state root (post-transaction state).
  bytes root = 2;
  // Status of the transaction (success or failure).
  uint64 status = 3;
  // Cumulative gas used in the block up to this transaction.
  uint64 cumulativeGasUsed = 4;
  // Bloom filter for the logs.
  bytes logsBloom = 5;
  // List of logs emitted by the transaction.
  repeated Log logs = 6;
  // Hash of the transaction.
  bytes transactionHash = 7;
  // Address of the contract created, if any.
  bytes contractAddress = 8;
  // Gas used by this transaction.
  uint64 gasUsed = 9;
  // Hash of the block containing the transaction.
  bytes blockHash = 10;
  // Block number containing the transaction.
  string blockNumber = 11; // Using string for big.Int
  // Index of the transaction in the block.
  uint64 transactionIndex = 12;
}

// InnerTx represents an internal transaction or call.
// Depth of the transaction in the call stack.
message InnerTx {
  string dept = 1; // Using string for big.Int
  // Internal index of the transaction.
  string internal_index = 2; // Using string for big.Int
  // Type of the call (e.g., CALL, DELEGATECALL).
  string call_type = 3;
  // Name of the function or call.
  string name = 4;
  // Trace address of the call in the execution trace.
  string trace_address = 5;
  // Address of the code being executed.
  string code_address = 6;
  // Sender address.
  string from = 7;
  // Recipient address.
  string to = 8;
  // Input data for the call.
  string input = 9;
  // Output data from the call.
  string output = 10;
  // Whether the call resulted in an error.
  bool is_error = 11;
  // Gas allocated for the call.
  uint64 gas = 12;
  // Gas used by the call.
  uint64 gas_used = 13;
  // Value transferred in the call (in Ether or token units).
  string value = 14;
  // Value in Wei.
  string value_wei = 15;
  // Call value in Wei.
  string call_value_wei = 16;
  // Error message, if any.
  string error = 17;
}

// RealtimeLogsRequest is an empty message used as a placeholder for initiating the OnRealtimeLogs stream.
// It may be extended in the future to include filtering criteria for logs (e.g., by address or topics).
message RealtimeLogsRequest {}

// RealtimeLogsReply represents a message containing RLP-encoded logs.
message RealtimeLogsReply {
  // RLP-encoded log data, representing the serialized form of logs emitted by smart contracts.
  bytes rlp_logs = 1;
}